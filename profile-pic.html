<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Setup | AfroMatch</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/slicknav.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --navy: #001f3f; --red: #ff4d4d; --pink: #ff3385; }
        body { background: var(--navy); color: white; font-family: 'Mulish', sans-serif; margin: 0; }
        
        /* Welcome Animation */
        #welcome-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--navy);
            display: flex; justify-content: center; align-items: center; z-index: 10000;
        }
        .sparkle { font-size: 2.5rem; font-weight: 900; background: linear-gradient(90deg, #fff, var(--red), #fff); 
                   background-size: 200%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 2s infinite; }

        /* Main Profile Layout */
        .main-content { max-width: 900px; margin: 50px auto; padding: 20px; display: flex; flex-wrap: wrap; gap: 40px; }
        .profile-side { flex: 1; min-width: 300px; text-align: center; }
        .pic-frame { width: 200px; height: 200px; border: 5px solid var(--pink); border-radius: 50%; margin: 0 auto; position: relative; padding: 5px; }
        #preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #111; }
        .cam-icon { position: absolute; bottom: 10px; right: 10px; background: var(--red); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid white; }

        .info-side { flex: 1.5; min-width: 300px; }
        .form-row { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: var(--red); font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; outline: none; }
        option { background: var(--navy); }

        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .save-btn { background: var(--red); color: white; }
        .boost-btn { background: #ffcc00; color: #333; display: none; }

        /* PAYMENT MODAL STYLING (YOUR ORIGINAL STYLE) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; }
        .modal-card { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 330px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.6); position: relative; }
        .plans-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .plan-mini { font-size: 11px; border: 1px solid #ddd; padding: 10px 5px; border-radius: 8px; background: #fdfdfd; color: #333; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .plan-mini input { margin-right: 5px; }
        .ins-box { background: #f4f7fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d1d9e6; text-align: left; }
        .pay-detail { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 13px; color: #444; }
        .highlight-text { color: #001f3f; font-size: 16px; font-weight: 900; letter-spacing: 0.5px; }
        .pay-now-btn { width: 100%; padding: 14px; background: #1b8d2b; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; }
        .pay-now-btn:disabled { background: #ccc; cursor: not-allowed; }
        .cancel-btn { background: none; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 8px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }
        .close-x { position: absolute; right: 15px; top: 10px; font-size: 24px; color: #999; cursor: pointer; }

        @keyframes shine { to { background-position: 200% center; } }
    </style>
    <style>
    /* 1. Make the hamburger icon and menu container solid navy */
.slicknav_menu {
    background: #001f3f !important; /* Your Navy Blue */
    padding: 10px !important;
}

/* 2. Force menu links to be White and Visible (Fixes the "invisible until hover" issue) */
.slicknav_nav a {
    color: #ffffff !important;
    font-weight: 700 !important;
    text-transform: uppercase;
    font-size: 14px;
    padding: 12px 20px !important;
}

/* 3. Style the "Browse" dropdown arrow and text */
.slicknav_item {
    color: #ffffff !important;
}

/* 4. Style the Sub-menu (Americans, Africans, etc.) to stand out */
.slicknav_nav ul {
    background: rgba(0, 0, 0, 0.808) !important; /* Slightly lighter background */
    margin: 5px 0 !important;
    border-left: 3px solid #ff4d4d; /* AfroMatch Red accent */
}

/* 5. Hover state: Change to AfroMatch Red */
.slicknav_nav a:hover, .slicknav_row:hover {
    background: #ff4d4d !important;
    color: #ffffff !important;
    border-radius: 5px;
}

/* 6. Fix for the hamburger icon lines (making them white) */
.slicknav_icon-bar {
    background-color: #ffffff !important;
}


</style>
</head>
<body>

    <div id="welcome-overlay"><div class="sparkle" id="welcomeUser">Welcome!</div></div>

    <header class="header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-2"><div class="header__logo"><a href="index.html"><img src="img/afro.png" alt="" style="max-height:50px;"></a></div></div>
                <div class="col-lg-8">
                    <nav class="header__menu mobile-menu">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="#">Browse</a></li>
                            <li><a href="contact.html">Contact</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div id="mobile-menu-wrap"></div>
        </div>
    </header>

    <h2 class="text-center mt-4" style="color:var(--red); font-weight:900;">AFROMATCH PROFILE</h2>

    <div class="main-content">
        <div class="profile-side">
            <div class="pic-frame">
                <img id="preview" src="img/placeholder.jpg">
                <label for="fileIn" class="cam-icon"><i class="fa fa-camera"></i></label>
                <input type="file" id="fileIn" style="display:none" accept="image/*">
            </div>
            <h3 id="userName" style="margin-top:20px;">Username</h3>
        </div>

        <div class="info-side">
            <div class="form-row"><label>Age</label><input type="number" id="age" placeholder="Required"></div>
            <div class="form-row">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Rather not say">Rather not say</option>
                </select>
            </div>
            <div class="form-row"><label>Location</label><input type="text" id="location" placeholder="City, Country"></div>
            <div class="form-row"><label>Bio</label><textarea id="bio" rows="3" placeholder="Tell us more..."></textarea></div>
            
            <button class="btn-action save-btn" onclick="saveProfile()">Save Profile</button>
            <button class="btn-action boost-btn" id="boostAction" onclick="openBoost()">Boost to Live 🚀</button>
        </div>
    </div>

    <!-- YOUR ORIGINAL PAYMENT MODAL -->
    <div id="boostModal" class="modal-overlay">
        <div class="modal-card">
            <span class="close-x" onclick="closeBoost()">×</span>
            <h3 style="color: #001f3f; margin-bottom: 5px;">Boost Profile 🔥</h3>
            <p style="font-size:11px; color:#888; margin-bottom:15px;">Select one category to go live.</p>

            <div id="plans" class="plans-grid">
                <label class="plan-mini"><input type="radio" name="p" value="20" onchange="showInstructions(20)"> Americans ($20)</label>
                <label class="plan-mini"><input type="radio" name="p" value="15" onchange="showInstructions(15)"> Black Am. ($15)</label>
                <label class="plan-mini"><input type="radio" name="p" value="10" onchange="showInstructions(10)"> Asians ($10)</label>
                <label class="plan-mini"><input type="radio" name="p" value="5" onchange="showInstructions(5)"> Africans ($5)</label>
            </div>

            <div id="mpesaInstructions" style="display: none;" class="ins-box">
                <div class="pay-detail"><span>business no:</span><strong class="highlight-text">400200</strong></div>
                <div class="pay-detail"><span>ACCOUNT no:</span><strong class="highlight-text">01102109295001</strong></div>
                <div class="pay-detail" style="border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 5px;">
                    <span>AMOUNT:</span><strong id="kesAmount" style="color: #ff4d4d;">KES 0</strong>
                </div>
            </div>

            <div class="modal-actions">
                <button class="pay-now-btn" id="payBtn" disabled onclick="window.location.href='tel:*334#'">Initiate M-Pesa</button>
                <button class="cancel-btn" onclick="closeBoost()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/jquery.slicknav.js"></script>
    <script>
        const phone = localStorage.getItem('currentUser');
        const user = JSON.parse(localStorage.getItem(phone));

        $(document).ready(function() {
            $('.mobile-menu').slicknav({ prependTo: '#mobile-menu-wrap' });
            if(user) {
                document.getElementById('userName').innerText = user.username;
                document.getElementById('welcomeUser').innerText = `Welcome, ${user.username}! ✨`;
                if(user.isComplete) {
                    document.getElementById('preview').src = user.profilePic;
                    document.getElementById('age').value = user.age;
                    document.getElementById('gender').value = user.gender;
                    document.getElementById('location').value = user.location;
                    document.getElementById('bio').value = user.bio;
                    document.getElementById('boostAction').style.display = 'block';
                }
            }
            setTimeout(() => { $('#welcome-overlay').fadeOut(1000); }, 2500);
        });

        // Image Selection
        document.getElementById('fileIn').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = () => {
                document.getElementById('preview').src = reader.result;
                user.profilePic = reader.result; 
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        // Strict Validation Save
        function saveProfile() {
            const age = document.getElementById('age').value;
            const gen = document.getElementById('gender').value;
            const loc = document.getElementById('location').value;

            if(!user.profilePic || user.profilePic.includes('placeholder')) {
                return alert("⚠️ Action Required: Please upload a profile picture!");
            }
            if(!age || !gen || !loc) {
                return alert("⚠️ Action Required: Please fill in your Age, Gender, and Location!");
            }

            user.age = age; user.gender = gen; user.location = loc;
            user.bio = document.getElementById('bio').value; 
            user.isComplete = true;
            
            localStorage.setItem(phone, JSON.stringify(user));
            alert("✅ Profile details saved successfully!");
            document.getElementById('boostAction').style.display = 'block';
        }

        // Modal Controls
        function openBoost() { document.getElementById('boostModal').style.display = 'flex'; }
        function closeBoost() { document.getElementById('boostModal').style.display = 'none'; }
        function showInstructions(val) {
            document.getElementById('kesAmount').innerText = "KES " + (val * 130).toLocaleString();
            document.getElementById('mpesaInstructions').style.display = 'block';
            document.getElementById('payBtn').disabled = false;
        }
    </script>
</body>
</html>
