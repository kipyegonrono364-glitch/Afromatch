<!-- 3. THE SCRIPT (The Logic Engine) -->
<script src="js/jquery-3.3.1.min.js"></script>

<script>
$(document).ready(function () {
    // 1. Initialize Hamburger Menu (Fix for mobile)
    $(".mobile-menu").slicknav({
        prependTo: '#mobile-menu-wrap',
        allowParentLinks: true,
        label: '' 
    });

    // 2. Your Current Profile Database
    const people = {
        "camila": {
            name: "Camila, 26",
            location: "Madrid, Spain",
            bio: "I love traveling, music and meeting new people. Looking for a serious relationship.",
            mainImg: "img/rr.jpg",
            thumbs: ["img/yy.jpg", "img/jj.jpg", "img/date2.jpg", "img/ss.jpg"]
        },
        "liz": {
            name: "Liz, 24",
            location: "Vienna, Austria",
            bio: "Fitness enthusiast and lifestyle blogger. Let's explore the world together.",
            mainImg: "img/xxx.jpg",
            thumbs: ["img/xxx.jpg", "img/kk.jpg", "img/date1.jpg"]
        },
        "sophia": {
            name: "Sophia, 28",
            location: "Toronto, Canada",
            bio: "Business oriented and loves fine dining. Looking for someone ambitious.",
            mainImg: "img/xxxx.jpg",
            thumbs: ["img/xxxx.jpg", "img/uu.jpg", "img/tt.jpg"]
        }
    };

    // 3. URL Detection Logic
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user') || 'camila'; // Changed default to camila

    if (people[userId]) {
        const p = people[userId];
        document.getElementById('profileName').innerText = p.name;
        document.getElementById('profileLocation').innerText = p.location;
        document.getElementById('profileBio').innerText = p.bio;
        document.getElementById('mainImage').src = p.mainImg;

        // Open Modal logic
        document.getElementById('whatsappBtn').onclick = function() {
            document.getElementById('boostModal').style.display = 'flex';
        };

        // Load Thumbnails
        const thumbBox = document.getElementById('thumbContainer');
        thumbBox.innerHTML = ''; // Clears container before adding
        p.thumbs.forEach(t => {
            let img = document.createElement('img');
            img.src = t;
            img.style.cssText = "width:80px; height:80px; object-fit:cover; border-radius:10px; cursor:pointer; border:2px solid transparent; margin-right:10px;";
            img.onclick = function() { document.getElementById('mainImage').src = this.src; };
            thumbBox.appendChild(img);
        });
    }
});

// 4. Modal Helper Functions (Outside document.ready so HTML buttons can see them)
function updatePay(usd) {
    document.getElementById('kesAmount').innerText = "KES " + (usd * 130).toLocaleString();
    document.getElementById('mpesaInstructions').style.display = 'block';
    document.getElementById('payBtn').disabled = false;
}

function closeBoost() {
    document.getElementById('boostModal').style.display = 'none';
}
</script>
