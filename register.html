<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AfroMatch</title>
    
    <!-- 1. ADDED LATEST FONTAWESOME (MUST BE HERE) -->
    <!-- High-reliability Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Example: Bootstrap CSS via Cloudflare CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">



    <style>
        :root { --navy: #001f3f; --red: #ff4d4d; }
        
        body { 
            background: linear-gradient(rgba(0, 31, 63, 0.7), rgba(0, 31, 63, 0.7)), 
                        url('img/rr.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Mulish', sans-serif; 
            margin: 0; 
            color: white; 
        }

        .reg-card { 
            background: rgba(255, 255, 255, 0.98);
            color: #333; 
            padding: 30px; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }

        /* 2. FIXED CONTAINER FOR ICON */
        .input-group-custom { 
            margin-bottom: 15px; 
            position: relative; 
        }

        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            padding-right: 45px; /* Leave space for eye icon */
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            color: #000 !important; /* Ensure black text */
        }

        /* 3. FIXED EYE POSITIONING */
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 38px; /* Perfectly centered inside the password input */
            cursor: pointer;
            color: #888;
            z-index: 99; /* Ensures it is on top */
            font-size: 18px;
        }

        .btn-reg { width: 100%; padding: 15px; background: var(--red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-reg:disabled { background: #ccc; cursor: not-allowed; }
        .checklist { font-size: 11px; color: #999; list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
        .valid { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <div class="reg-card">
        <h2 style="text-align:center; color: var(--navy); margin-bottom:20px;">Create Account</h2>
        <form id="registerForm">
            <div class="input-group-custom">
                <label>Username</label>
                <input type="text" id="regUser" placeholder="Full Name" required>
            </div>
            
            <div class="input-group-custom">
                <label>Phone Number</label>
                <input type="tel" id="regPhone" placeholder="07..." maxlength="10" required>
            </div>
            
            <div class="input-group-custom">
                <label>Password</label>
                <input type="password" id="regPass" placeholder="Create Password" required>
                <!-- 4. ICON TRIGGER -->
                <i class="fa-solid fa-eye-slash eye-icon" id="toggleEye"></i>
                
                <ul class="checklist">
                    <li id="c8"><i class="fa-solid fa-circle-dot"></i> 8+ Characters</li>
                    <li id="cU"><i class="fa-solid fa-circle-dot"></i> Uppercase</li>
                    <li id="cN"><i class="fa-solid fa-circle-dot"></i> A Number</li>
                    <li id="cS"><i class="fa-solid fa-circle-dot"></i> Special Char</li>
                </ul>
            </div>
            <button type="submit" class="btn-reg" id="regBtn" disabled>Register & Start Setup</button>
        </form>
    </div>

    <script>
        const pass = document.getElementById('regPass');
        const phone = document.getElementById('regPhone');
        const regBtn = document.getElementById('regBtn');
        const toggleEye = document.getElementById('toggleEye');

        // 1. Toggle Function
        toggleEye.onclick = function() {
            if (pass.type === "password") {
                pass.type = "text";
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            } else {
                pass.type = "password";
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            }
        };

        // 2. Phone Formatting
        phone.oninput = () => phone.value = phone.value.replace(/[^0-9]/g, '');

        // 3. Validation Logic
        pass.oninput = () => {
            const v = pass.value;
            const r = { 
                c8: v.length >= 8, 
                cU: /[A-Z]/.test(v), 
                cN: /[0-9]/.test(v), 
                cS: /[^A-Za-z0-9]/.test(v) 
            };
            let allOk = true;
            for (let k in r) {
                document.getElementById(k).className = r[k] ? 'valid' : '';
                if(!r[k]) allOk = false;
            }
            regBtn.disabled = !(allOk && phone.value.length === 10);
        };

        // 4. Save & Redirect
        document.getElementById('registerForm').onsubmit = (e) => {
            e.preventDefault();
            const userData = {
                username: document.getElementById('regUser').value,
                phone: phone.value,
                password: pass.value,
                isComplete: false 
            };
            localStorage.setItem(userData.phone, JSON.stringify(userData));
            localStorage.setItem('currentUser', userData.phone);
            window.location.href = 'profile-pic.html';
        };
    </script>
</body>
</html>
